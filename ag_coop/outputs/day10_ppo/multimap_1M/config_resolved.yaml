episode:
  horizon_steps: 500
  decision_period: 5
  map_path: maps/map_02.map
  seed: 0
robots:
  n_ugv: 3
  n_uav: 1
uav:
  speed_cells_per_step: 1
  neighbor_mode: 8
  service_time: 2
  loiter_energy_cost: 1
  meet_window: 3
  max_loiter_steps: 20
ugv:
  speed_cells_per_step: 1
  neighbor_mode: 4
  hold_steps: 5
  carrier_id: 0
rendezvous:
  candidate_count: 12
  mode: candidates
  score_alpha_snr: 1.0
  score_beta_eta: 0.3
sync_depart:
  enabled: true
  buffer_steps: 2
  max_depart_delay: 30
  min_trigger_gap: 1
tasks:
  enabled: true
  arrival_process: bernoulli
  arrival_rate: 0.1
  deadline_min: 25
  deadline_max: 60
  max_active: 20
  top_m: 5
  service_time: 2
comm:
  enabled: true
  tx_power_db: 0.0
  pathloss_n: 2.0
  obstacle_penalty_db: 6.0
  snr_threshold_db: -9.0
  eps_m: 0.05
mapf:
  enabled: false
  H: 40
  time_budget_ms: 300
  connectivity: 4
  priority: carrier_first
rl:
  decision_period_K: 5
  reward_weights:
    task_completion: 1.5
    time_penalty: 0.01
    comm_penalty: 0.04
    deadline_penalty: 0.08
    mapf_timeout_penalty: 0.15
  obs:
    top_m: 5
    candidate_count: 12
  action:
    n_task_choices: 6
    n_relay_targets: 13
training:
  maps:
  - maps/map_01.map
  - maps/map_02.map
  - maps/map_03.map
  total_timesteps: 1000000
  n_envs: 8
  batch_size: 256
  n_steps: 64
  n_epochs: 10
  learning_rate: 0.0005
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.02
  vf_coef: 0.5
  max_grad_norm: 0.5
  save_freq: 100000
  eval_freq: 5000
  eval_episodes: 10
logging:
  out_dir: outputs/ppo_multimap_1M
  save_trace: true
  save_metrics: true
  tensorboard: true
