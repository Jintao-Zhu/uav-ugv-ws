# Day10 PPO Training Configuration
# 固定实验面，确保训练稳定性

episode:
  horizon_steps: 500          # 与 Day9 smoke test 一致
  decision_period: 5          # K=5，每 5 步一次决策
  map_path: "maps/map_01.map" # 20x20 地图（Day8 主地图）
  seed: 0                     # 默认种子（训练时会覆盖）

robots:
  n_ugv: 3                    # 3 个 UGV
  n_uav: 1                    # 1 个 UAV

uav:
  speed_cells_per_step: 1
  neighbor_mode: 8            # 8-邻域
  service_time: 2
  loiter_energy_cost: 1
  meet_window: 3
  max_loiter_steps: 20

ugv:
  speed_cells_per_step: 1
  neighbor_mode: 4            # 4-邻域
  hold_steps: 5
  carrier_id: 0               # UGV 0 是 carrier

rendezvous:
  candidate_count: 12         # R=12 个候选中继点
  mode: "candidates"
  score_alpha_snr: 1.0
  score_beta_eta: 0.3

sync_depart:
  enabled: true
  buffer_steps: 2
  max_depart_delay: 30
  min_trigger_gap: 1

tasks:
  enabled: true
  arrival_process: "bernoulli"
  arrival_rate: 0.1           # 泊松到达率
  deadline_min: 25
  deadline_max: 60
  max_active: 20
  top_m: 5                    # M=5 个 top 任务
  service_time: 2

comm:
  enabled: true
  tx_power_db: 0.0
  pathloss_n: 2.0
  obstacle_penalty_db: 6.0    # lambda_low（低遮挡，训练更稳定）
  snr_threshold_db: -9.0
  eps_m: 0.05

mapf:
  enabled: false              # Day10 暂不启用 MAPF
  H: 40
  time_budget_ms: 300
  connectivity: 4
  priority: "carrier_first"

# RL 特定配置
rl:
  decision_period_K: 5        # 决策周期（与 episode.decision_period 一致）

  # Reward 权重（与 Day9 Step 4 一致）
  reward_weights:
    task_completion: 1.0      # r_task: +1.0 per task
    time_penalty: 0.01        # r_time: -0.01 per step
    comm_penalty: 0.05        # r_comm: -0.05 per outage step
    deadline_penalty: 0.1     # r_deadline: -0.1 per miss
    mapf_timeout_penalty: 0.2 # r_mapf: -0.2 per timeout

  # Observation space 配置
  obs:
    top_m: 5                  # 观测前 M 个任务
    candidate_count: 12       # 观测 R 个候选点

  # Action space 配置
  action:
    n_task_choices: 6         # 0-4: top-5 tasks, 5: no-task
    n_relay_targets: 13       # 0-11: candidates, 12: no-relay

# Training 特定配置
training:
  maps:
    - "maps/map_01.map"       # 主训练地图（20x20，Day8 使用）

  # 可选：多地图训练（暂时注释）
  # maps:
  #   - "maps/map_01.map"
  #   - "maps/test_small.map"

  total_timesteps: 100000     # 100k 步（小规模训练）
  n_envs: 4                   # 并行环境数量
  batch_size: 256             # PPO batch size
  n_steps: 64                 # 每个环境收集的步数 (batch_size / n_envs)
  n_epochs: 10                # PPO 训练 epochs
  learning_rate: 0.0003       # 学习率
  gamma: 0.99                 # 折扣因子
  gae_lambda: 0.95            # GAE lambda
  clip_range: 0.2             # PPO clip range
  ent_coef: 0.01              # 熵系数（鼓励探索）
  vf_coef: 0.5                # Value function 系数
  max_grad_norm: 0.5          # 梯度裁剪

  # Checkpoint 配置
  save_freq: 50000            # 每 5 万步保存一次
  eval_freq: 2500             # 每 2500 步评估一次
  eval_episodes: 5            # 评估时跑 5 个 episode（固定种子）

logging:
  out_dir: "outputs/day10_ppo"
  save_trace: true
  save_metrics: true
  tensorboard: true           # 启用 TensorBoard
