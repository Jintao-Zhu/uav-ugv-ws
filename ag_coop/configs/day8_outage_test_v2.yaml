episode:
  horizon_steps: 500
  decision_period: 5
  map_path: "maps/map_01.map"  # 使用现有地图，有障碍物遮挡
  seed: 42  # 使用不同的 seed，可能产生更分散的初始位置

robots:
  n_ugv: 3  # 保持 3 个 UGV，让它们分散
  n_uav: 1

uav:
  speed_cells_per_step: 1
  neighbor_mode: 8
  service_time: 2
  loiter_energy_cost: 1
  meet_window: 3
  max_loiter_steps: 20

ugv:
  speed_cells_per_step: 1
  neighbor_mode: 4
  hold_steps: 5
  carrier_id: 0

rendezvous:
  candidate_count: 12
  mode: "candidates"
  score_alpha_snr: 1.0
  score_beta_eta: 0.3

sync_depart:
  enabled: true
  buffer_steps: 2
  max_depart_delay: 30
  min_trigger_gap: 1

tasks:
  enabled: true
  arrival_process: "bernoulli"
  arrival_rate: 0.12           # 适中的任务生成率
  deadline_min: 25
  deadline_max: 60
  max_active: 20
  top_m: 5
  service_time: 2

comm:
  enabled: true
  tx_power_db: -6.0            # 微调发射功率
  pathloss_n: 3.0              # 适中的路径损耗指数
  obstacle_penalty_db: 15.0    # 适中的障碍物惩罚
  snr_threshold_db: 34.5       # 设置为 34.5 dB（略高于观察到的 34.03 dB）
  eps_m: 0.05

mapf:
  enabled: false
  H: 40
  time_budget_ms: 300
  connectivity: 4
  priority: "carrier_first"

logging:
  out_dir: "outputs"
  save_trace: true
  save_metrics: true
