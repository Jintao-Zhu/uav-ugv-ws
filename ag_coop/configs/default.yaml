episode:
  horizon_steps: 500
  decision_period: 5   # K
  map_path: "maps/map_01.map"   # 先占位，后面再换成你的地图路径
  seed: 0

robots:
  n_ugv: 3
  n_uav: 1

tasks:
  enabled: true
  arrival_rate: 0.1     # 每步到达概率（Day1 先不用也行）
  deadline_min: 80
  deadline_max: 160
  top_m: 5

comm:
  enabled: true
  tx_power_db: 0.0          # 常数项（基准 SNR）
  pathloss_n: 2.0           # 距离衰减指数
  obstacle_penalty_db: 6.0  # 每穿过一个障碍格扣多少 dB
  snr_threshold_db: -20.0   # outage 阈值
  eps_m: 0.05               # 避免 log(0) 的小量

logging:
  out_dir: "outputs"
  save_trace: true
  save_metrics: true
