episode:
  horizon_steps: 500
  decision_period: 5   # K
  map_path: "maps/map_01.map"   # 先占位，后面再换成你的地图路径
  seed: 0

robots:
  n_ugv: 3
  n_uav: 1

tasks:
  enabled: true
  arrival_process: "bernoulli"  # 到达过程类型（目前仅支持 bernoulli）
  arrival_rate: 0.1             # 每步生成任务概率（校准后：miss_rate=28.5%）
  deadline_min: 25              # 最小 deadline（步数）
  deadline_max: 60              # 最大 deadline（步数）
  max_active: 20                # 任务池最大容量（满了丢弃新任务）
  top_m: 5                      # Top-M 任务数量（用于策略）
  service_time: 2               # 到点服务时间（步数）
  # 任务负载 profile（可选）：
  # - light: arrival_rate=0.05, deadline=[25,60] (miss_rate=1.2%, 压力很小)
  # - default: arrival_rate=0.10, deadline=[25,60] (miss_rate=28.5%, 平衡)
  # - heavy: arrival_rate=0.20, deadline=[25,60] (miss_rate=69.5%, 压力大)

comm:
  enabled: true
  tx_power_db: 0.0          # 常数项（基准 SNR）
  pathloss_n: 2.0           # 距离衰减指数
  obstacle_penalty_db: 6.0  # 每穿过一个障碍格扣多少 dB
  snr_threshold_db: -9.0    # outage 阈值（校准后：14% outage on map_01）
  eps_m: 0.05               # 避免 log(0) 的小量
  # 通信 profile（可选）：
  # - relaxed: -12.0 dB (6% outage, 通信宽松)
  # - default: -9.0 dB (14% outage, 平衡)
  # - strict: -7.0 dB (26% outage, 通信苛刻)

logging:
  out_dir: "outputs"
  save_trace: true
  save_metrics: true
